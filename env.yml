channels:
  - conda-forge
  - bioconda
dependencies:
  # External tools used by the pipeline. The -10/-35 scan reads MEME-format
  # files directly in Python, so the MEME suite is not required.
  # conda-forge must precede bioconda, and keep the Prokka pin: without it
  # some solvers resolve Prokka 1.13, which cannot run with current BLAST.
  - python=3.12
  - prokka>=1.14.6
  - hmmer
  - pip
