[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "profinder"
version = "0.1.0"
description = "ProFinder — identify and extract bacterial or archaeal promoter sequences from a single genome, scan for motifs, and generate an HTML report"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "James Marsh"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
    "biopython>=1.79",
]

[project.optional-dependencies]
# matplotlib is only needed to render the figure produced by
# --diagnose-p-sweep; the pipeline itself does not import it.
diagnostics = ["matplotlib>=3.4"]
# scipy is optional: used only for a generalised-Pareto tail refinement
# of the per-genome empirical null. The scan falls back to the plain
# empirical quantile when it is absent.
stats = ["scipy>=1.7"]

[project.scripts]
profinder = "profinder.pipeline:main"

[project.urls]
Repository = "https://github.com/jmarsh/profinder"

# "profinder*" captures the profinder.empirical subpackage (it has an
# __init__.py), so its modules ship without a separate entry.
[tool.setuptools.packages.find]
include = ["profinder*"]

[tool.setuptools.package-data]
# ppv_calibration.json ships only if a calibration has been fitted and
# placed at profinder/ppv_calibration.json; harmless when absent.
profinder = ["all_unique_subgroups.meme", "hmms/*.hmm", "motifs/*.meme", "ppv_calibration.json"]
